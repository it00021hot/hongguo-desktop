# 红果桌面版 —— NSH 与共享业务内核的 Rust workspace。
#
# 本文件承载三件事，每件都「必须在根」：
#   1. [workspace] members —— 自底向上拆分后逐个加入；
#   2. [patch.crates-io] —— patch 仅在根 manifest 生效，留在 member 里会被忽略；
#   3. [profile.*] —— 同上，Cargo 只认根 manifest 的 profile 定义。
#
# 随之而动的还有 Cargo.lock 与 target/：workspace 化后都落在仓库根。

[workspace]
# 虚拟 manifest 必须显式声明 resolver，否则默认退回 "1"——edition 2024 的
# feature 解析语义会静默变化。
resolver = "3"
members = [
    "tools/build",
    "crates/hongguo-api",
    "crates/hongguo-bytevc2",
    "crates/hongguo-common",
    "crates/hongguo-hevc",
    "crates/hongguo-native-clock",
    "crates/hongguo-media-types",
    "crates/hongguo-playback",
    "crates/hongguo-vvdec-sys",
    "crates/hongguo-nsh",
    "crates/hongguo-nsh-android",
    "crates/hongguo-nsh-ios",
    "crates/hongguo-nsh-video-api",
    "crates/hongguo-nsh-video-apple",
    "crates/hongguo-nsh-video-macos",
    "crates/hongguo-nsh-video-ios",
    "crates/hongguo-nsh-video-windows",
    "crates/hongguo-nsh-video-android",
    "crates/hongguo-media",
    "crates/hongguo-media-platform",
    "crates/hongguo-media-platform-android",
    "crates/hongguo-media-videotoolbox",
    "crates/hongguo-media-platform-windows",
    "crates/hongguo-video",
    "crates/hongguo-video-color",
    "crates/hongguo-video-gpu",
    "crates/hongguo-service",
    "crates/hongguo-signer",
    "crates/hongguo-store",
    "crates/hongguo-stream",
]
# vendor/ 由 [patch.crates-io] 的 path 引用。位于 workspace 目录树内、被
# path/patch 引用的包会被 Cargo 自动收成 member；若不排除，门禁会去 lint
# 上游代码（clippy -D warnings 必挂），cargo test 也会跑它们的用例。
exclude = ["vendor/nsh", "vendor/wgpu-hal"]

# 各 crate 共享构建版本；应用元数据独立以 crates/hongguo-nsh/nsh.json 为准。
# 成员用 `xxx.workspace = true` 继承。
[workspace.package]
version = "0.8.4"
edition = "2024"
# MSRV 跟随当前 stable 工具链（1.99.1）。应用不是库，MSRV 只影响依赖解析。
rust-version = "1.99.1"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["hongguo-desktop contributors"]

[workspace.dependencies]
nsh-core = { path = "vendor/nsh/crates/nsh-core" }
nsh-base = { path = "vendor/nsh/crates/nsh-base" }
nsh-updater = { path = "vendor/nsh/crates/nsh-updater" }
nsh-platform-macos = { path = "vendor/nsh/crates/nsh-platform-macos", default-features = false, features = ["svg", "updater"] }
nsh-platform-windows = { path = "vendor/nsh/crates/nsh-platform-windows", default-features = false, features = ["svg", "net", "media", "updater"] }
nsh-android-runtime = { package = "nsh-platform-android", path = "vendor/nsh/crates/nsh-platform-android", default-features = false, features = ["svg"] }
nsh-platform-ios = { path = "vendor/nsh/crates/nsh-platform-ios", default-features = false, features = ["svg"] }

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }

# CI 实测（Windows，2026-10）：fat LTO + 单 codegen 单元让 rustc 段 17-18 分钟，
# 是发版流水线的大头。换 thin LTO + 默认并行单元后编译时间砍半以上；本项目的
# 热点（编解码 SIMD、运行期指令集分发）都在独立 crate 里自带优化，自身代码是
# 胶水层，跨 crate 全量优化收益本来就小。体积略涨（<5%），换发版速度值得。
#
# 保留 unwind：原生播放器工作线程需要捕获失败并完成资源释放。
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# dev 档只留行号级调试信息。全量 debuginfo（DWARF 生成 + PDB 落盘）是
# make dev 编译段的大头——release 提交（全 crate 版本号变更）后首次 dev
# 全 workspace 重编实测 1m10s，行号级砍掉变量级调试数据后编译与链接显著
# 提速。栈回溯仍带文件与行号（Win32 dump 的 .pdata + 行号符号化不受影响），
# 代价只是调试器里看不到变量值；release 的 strip=true 不动。
[profile.dev]
debug = "line-tables-only"

# 第三方依赖保留 O2；工作区自身保持可调试与增量编译。
[profile.dev.package."*"]
opt-level = 2
