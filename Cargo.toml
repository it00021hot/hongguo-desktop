# 红果桌面版 —— Rust workspace 根（阶段 0：src-tauri 原地成为唯一 member）。
#
# 本文件承载三件事，每件都「必须在根」：
#   1. [workspace] members —— 自底向上拆分后逐个加入；
#   2. [patch.crates-io] —— patch 仅在根 manifest 生效，留在 member 里会被忽略；
#   3. [profile.*] —— 同上，Cargo 只认根 manifest 的 profile 定义。
#
# 随之而动的还有 Cargo.lock 与 target/：workspace 化后都落在仓库根。

[workspace]
# 虚拟 manifest 必须显式声明 resolver，否则默认退回 "1"——edition 2024 的
# feature 解析语义会静默变化。
resolver = "3"
members = [
    "crates/hongguo-api",
    "crates/hongguo-bytevc2",
    "crates/hongguo-common",
    "crates/hongguo-gpui",
    "crates/hongguo-media",
    "crates/hongguo-media-platform",
    "crates/hongguo-media-platform-api",
    "crates/hongguo-media-platform-android",
    "crates/hongguo-media-platform-macos",
    "crates/hongguo-media-platform-windows",
    "crates/hongguo-media-videotoolbox",
    "crates/hongguo-video",
    # 回放契约 + 系统播放器（门面 / macOS / Windows 实现）：
    # 平台实现分 crate，壳只依赖门面。
    "crates/hongguo-player",
    "crates/hongguo-player-api",
    "crates/hongguo-player-macos",
    "crates/hongguo-player-windows",
    "crates/hongguo-protocol",
    "crates/hongguo-service",
    "crates/hongguo-signer",
    "crates/hongguo-store",
    "crates/hongguo-stream",
    "crates/hongguo-tauri",
    "crates/hongguo-tauri-app",
]
# vendor/ 由 [patch.crates-io] 的 path 引用。位于 workspace 目录树内、被
# path/patch 引用的包会被 Cargo 自动收成 member；若不排除，门禁会去 lint
# 上游代码（clippy -D warnings 必挂），cargo test 也会跑它们的用例。
exclude = ["vendor/*"]

# 各 crate 共享的 package 字段：发版只改这里一处（另需改 package.json 与
# tauri.conf.json），成员用 `xxx.workspace = true` 继承。
[workspace.package]
version = "0.6.6"
edition = "2024"
# MSRV 跟随当前 stable 工具链（1.99.1）。应用不是库，MSRV 只影响依赖解析。
rust-version = "1.99.1"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["hongguo-desktop contributors"]

[patch.crates-io]
# gpui-pre-windows 0.3.12 的渲染器没有视频画面的落点，而系统播放器
# （Media Foundation Media Engine 的 frame-server 模式）经 TransferVideoFrame
# 把帧写进渲染器设备上的纹理，需要渲染器把它画出来——且必须与 GPUI 内容
# 同画布（macOS 侧的对应结构是 AVPlayerLayer 插在 GPUIView 之下）。
#
# 补丁新增 `video_quad` 模块：视频纹理与 GPUI 内容画进同一张渲染目标
# （上一代独立 DComp 视觉位方案的整类坑——跨画布半像素缝、两 swapchain
# 错帧、z 序反直觉——在单画布下结构性不存在），并补上渲染器设备的
# VIDEO_SUPPORT 与多线程保护（见 crates/hongguo-player-windows/src/view.rs）。
# 待上游提供原生视频挂点后回收。
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

# CI 实测（Windows，2026-10）：fat LTO + 单 codegen 单元让 rustc 段 17-18 分钟，
# 是发版流水线的大头。换 thin LTO + 默认并行单元后编译时间砍半以上；本项目的
# 热点（编解码 SIMD、运行期指令集分发）都在独立 crate 里自带优化，自身代码是
# 胶水层，跨 crate 全量优化收益本来就小。体积略涨（<5%），换发版速度值得。
#
# ⚠️ 绝不能加 panic = "abort"（2026-10-09 小窗闪退实录）。abort 策略让两类
# catch 机制在 release 里静默失效，而 dev 默认 unwind——线上和开发行为分裂：
# 1. wry 的 WKURLSchemeHandler 回包用 objc2::exception::catch 兜 NSException；
#    abort 下 catch 的着陆垫被替换成 panic_cannot_unwind，ObjC 异常直接
#    abort——进小窗 resize 时 WebKit 取消 in-flight 流请求，worker 回包撞上
#    已停止的 task 即抛异常，v0.1.0 装机版小窗必闪退（crash.log: "panic in a
#    function that cannot unwind"，线程 hongguo-proto-stream-1）。
# 2. protocol/register.rs 的 catch_unwind 三层防线整体变 no-op——协议路径上
#    任何一个 panic 都从「一条请求回 500」升级成全进程 abort，2026-10-07
#    那次「回调 panic → abort → 僵尸进程锁库」的教训在 release 里等于没修。
# 代价是二进制略大（unwind 表）与微弱性能差，换正确性，值。
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# dev 档只留行号级调试信息。全量 debuginfo（DWARF 生成 + PDB 落盘）是
# make dev 编译段的大头——release 提交（全 crate 版本号变更）后首次 dev
# 全 workspace 重编实测 1m10s，行号级砍掉变量级调试数据后编译与链接显著
# 提速。栈回溯仍带文件与行号（Win32 dump 的 .pdata + 行号符号化不受影响），
# 代价只是调试器里看不到变量值；release 的 strip=true 不动。
[profile.dev]
debug = "line-tables-only"

# 只对这一个依赖关掉 debug 断言，别把自己的代码也一起降级。
#
# `rusty_h265-accel` 的去块滤波在帧边界有个过严的 `debug_assert`
# （deblock.rs:331，水平边要求 x >= 4）。1080p 真实码流第一帧就踩到，
# 结果 dev 下整个软解必然 panic。
#
# 它确实只是一条断言：release 不编译它，该段 SIMD 路径又由 `if ok` 守住
# 会整段跳过。不这么配就只能全局降级或强制 release，那会把真实断言一起埋掉。
# 现状消费者是 HEIC 封面软解（`hongguo-media::heif`）——纯 Rust 视频转码
# 兜底移除后，转码不再经过 rusty_h265。
[profile.dev.package.rusty_h265-accel]
debug-assertions = false

# 依赖在 dev 下也开 O2：GPUI 壳（gpui-pre Windows 平台层）每个 vsync 都
# 全量重绘一次窗口，dev 档零优化的 taffy 布局 + 绘制 + 文字排版让内容页
# 一帧 40-70ms（恒定 15-21fps，2026-10-24 帧停顿探针实测），任何页面都
# 「不流畅」。workspace 自己的代码保持 dev 档（增量编译快、可调试），只
# 优化 rarely-edit 的依赖；首次构建慢几分钟，之后改壳代码仍是秒级增量。
[profile.dev.package."*"]
opt-level = 2
