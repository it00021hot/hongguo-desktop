name: Windows cross toolchain on macOS
description: Prepare the MSVC cross compiler and optional Inno Setup compiler on Intel macOS
inputs:
  installer:
    description: Prepare Wine and Inno Setup for NSH packaging
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/cache@v6.1.0
      id: xwin-tool
      with:
        path: ${{ runner.tool_cache }}/cargo-xwin-0.23.1
        key: macos-x64-cargo-xwin-binary-0.23.1
    - name: Install pinned cargo-xwin
      if: steps.xwin-tool.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install cargo-xwin --version 0.23.1 --locked --root "$RUNNER_TOOL_CACHE/cargo-xwin-0.23.1"
    - name: Prepare LLVM and cargo-xwin
      shell: bash
      run: |
        if [ "$RUNNER_OS" != macOS ] || [ "$RUNNER_ARCH" != X64 ]; then
          echo 'Windows cross jobs require an Intel macOS runner' >&2
          exit 1
        fi
        if ! brew list --versions llvm@19 >/dev/null 2>&1; then
          brew install llvm@19
        fi
        llvm_bin="$(brew --prefix llvm@19)/bin"
        mkdir -p "$RUNNER_TEMP/windows-cross/bin"
        cat > "$RUNNER_TEMP/windows-cross/bin/rc.exe" <<SHIM
        #!/bin/bash
        set -euo pipefail
        args=("\$@")
        count=\${#args[@]}
        if [ "\$count" -gt 0 ]; then
          exec "$llvm_bin/llvm-rc" "\${args[@]:0:\$((count-1))}" -- "\${args[count-1]}"
        fi
        exec "$llvm_bin/llvm-rc"
        SHIM
        chmod +x "$RUNNER_TEMP/windows-cross/bin/rc.exe"
        {
          echo "$llvm_bin"
          echo "$RUNNER_TOOL_CACHE/cargo-xwin-0.23.1/bin"
          echo "$RUNNER_TEMP/windows-cross/bin"
        } >> "$GITHUB_PATH"
        {
          echo "XWIN_CACHE_DIR=$RUNNER_TEMP/cargo-xwin"
          echo 'XWIN_ARCH=x86_64'
        } >> "$GITHUB_ENV"
        export PATH="$RUNNER_TOOL_CACHE/cargo-xwin-0.23.1/bin:$PATH"
        cargo xwin --version
    - uses: actions/cache@v6.1.0
      with:
        path: ${{ runner.temp }}/cargo-xwin
        key: macos-x64-cargo-xwin-0.23.1-desktop
    - name: Prepare pinned Wine and Inno Setup
      if: inputs.installer == 'true'
      shell: bash
      env:
        WINE_SHA256: b50dc50ec7f41d58b115a6b685d4d1315ba3c797bd3aa0f49213f2703cb82388
        WINE_DEVEL_SHA256: 9909b486657e10ab66c7279371ae1f990345b596b3b1b3a0cf21f28af24fa0ce
        INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
        TRANSLATION_SHA256: e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d
      run: |
        tools="$RUNNER_TEMP/windows-cross"
        mkdir -p "$tools/bin"
        export WINEDLLOVERRIDES='mscoree,mshtml='
        # macOS 15 Intel runner（15.7.9）上 wine-stable 11.0_1 的 wineboot 启动事件等待
        # 超时，前缀半初始化后 kernel32 加载失败（c0000135）；wine-devel 11.21 正常。
        # 以 devel 为主候选，失败时重建前缀各重试一次后换下一候选，重试保留诊断输出。
        init_prefix() {
          export WINEPREFIX="$tools/prefix"
          wineserver -k 2>/dev/null || true
          rm -rf "$WINEPREFIX"
          if wineboot --init && wineserver -w; then
            wine cmd /c echo wine-ok
          else
            return 1
          fi
        }
        wine_ready=false
        for candidate in \
          '11.21|wine-devel-11.21-osx64.tar.xz|Wine Devel.app|WINE_DEVEL_SHA256' \
          '11.0_1|wine-stable-11.0_1-osx64.tar.xz|Wine Stable.app|WINE_SHA256'; do
          IFS='|' read -r tag tarball bundle sha_var <<< "$candidate"
          curl -fL --retry 3 "https://github.com/Gcenx/macOS_Wine_builds/releases/download/$tag/$tarball" -o "$tools/wine.tar.xz"
          echo "${!sha_var}  $tools/wine.tar.xz" | shasum -a 256 -c - || continue
          tar -xf "$tools/wine.tar.xz" -C "$tools"
          export PATH="$tools/$bundle/Contents/Resources/wine/bin:$PATH"
          wine --version || continue
          for attempt in 1 2; do
            if [ "$attempt" = 2 ]; then unset WINEDEBUG; else export WINEDEBUG=-all; fi
            if init_prefix; then
              wine_ready=true
              wine_bin="$tools/$bundle/Contents/Resources/wine/bin"
              break
            fi
            echo "wineboot attempt $attempt failed for $tarball" >&2
            df -h / | tail -1 >&2
          done
          if [ "$wine_ready" = true ]; then break; fi
        done
        if [ "$wine_ready" != true ]; then echo 'All pinned wine candidates failed to initialize a prefix' >&2; exit 1; fi
        export WINEDEBUG=-all
        curl -fL --retry 3 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -o "$tools/inno.exe"
        echo "$INNO_SHA256  $tools/inno.exe" | shasum -a 256 -c -
        inno_dir="$tools/inno"
        wine "$tools/inno.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- "/DIR=$(winepath -w "$inno_dir")"
        test -f "$inno_dir/ISCC.exe"
        curl -fL --retry 3 'https://raw.githubusercontent.com/jrsoftware/issrc/6ef32198ef1f7b7b375cd4b6b90896c2a58eb4c2/Files/Languages/ChineseSimplified.isl' -o "$inno_dir/Languages/ChineseSimplified.isl"
        echo "$TRANSLATION_SHA256  $inno_dir/Languages/ChineseSimplified.isl" | shasum -a 256 -c -
        cat > "$tools/bin/iscc" <<'WRAPPER'
        #!/bin/bash
        set -euo pipefail
        args=()
        for arg in "$@"; do
          case "$arg" in
            /O*) args+=("/O$(winepath -w "${arg#/O}")") ;;
            *.iss) args+=("$(winepath -w "$arg")") ;;
            *) args+=("$arg") ;;
          esac
        done
        exec wine "$WINE_INNO_DIR/ISCC.exe" "${args[@]}"
        WRAPPER
        chmod +x "$tools/bin/iscc"
        echo "$wine_bin" >> "$GITHUB_PATH"
        {
          echo "WINEPREFIX=$WINEPREFIX"
          echo 'WINEDEBUG=-all'
          echo 'WINEDLLOVERRIDES=mscoree,mshtml='
          echo "WINE_INNO_DIR=$inno_dir"
        } >> "$GITHUB_ENV"
