# Android APK 构建（Tauri 壳移动端）——手动触发。
#
# 只出 arm64（aarch64-linux-android）release APK：现代 Android 设备全覆盖，
# 多 ABI 编译时间翻倍但受众增量近零，要加再在 targets 里扩。
# 签名用仓库 secrets（ANDROID_KEYSTORE_BASE64 / _PASSWORD / _ALIAS）注入
# gen/android/app/build.gradle.kts 的 env 签名块；缺 secrets 时产物为未签名
# APK（无法安装，仅证明编译链路通）。workflow_dispatch 的手动触发菜单只在
# 本文件位于默认分支（main）后出现；dev 上验证用 `gh workflow run android.yml --ref dev`。
#
# runner 用自带 Android SDK/NDK（ubuntu images 预装在 /usr/local/lib/android/sdk，
# 含 NDK 与 platforms/build-tools），本地开发机无需装 SDK——gen/android 的
# gradle 工程已提交入库，构建完全在 CI。
name: Android APK

on:
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android

      # 与桌面 CI 的缓存分 key：android 目标的依赖编译产物独立成桶
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: android-aarch64

      # AGP 对 compileSdk 37 需要 JDK 17+；gradle 依赖缓存进 ~/.gradle
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 签名材料只落 $RUNNER_TEMP（job 结束即焚），keystore 不进构建目录
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hongguo-release.keystore"
          {
            echo "TAURI_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hongguo-release.keystore"
            echo "TAURI_ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "TAURI_ANDROID_KEYSTORE_ALIAS=$ANDROID_KEYSTORE_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand（pnpm build，产出 dist/）由 tauri CLI 自动执行
      - name: Build APK (arm64 release)
        env:
          # 内置软解（HEVC / ByteVC1 / ByteVC2）的 ByteVC2 解码器 VVdeC 从 crate 自带源码经 NDK 交叉构建。
          # 下面几项在本地 macOS + NDK 29 上逐个踩出来（见 docs/softdec-direct-play-plan.md 第六轮）：
          # - BUILD_INTERNAL：runner 上没有系统 libvvdec，必须内建；system-deps 读内建产物的 pkg-config 要放行交叉。
          # - CMAKE_TOOLCHAIN_FILE：给 NDK 工具链（包装文件钉 arm64-v8a / API 24），否则构建脚本重跑时 CMake 丢掉 Android 目标。
          # - LIBVVDEC_LIB：VVdeC 生成的 .pc 里有 `-l:libunwind.a`（rustc 解析成空库名）和动态 libc++
          #   （APK 不带 libc++_shared.so），改成静态 libc++；libunwind 由 Rust std 自己链。
          SYSTEM_DEPS_LIBVVDEC_BUILD_INTERNAL: always
          PKG_CONFIG_ALLOW_CROSS_aarch64_linux_android: '1'
          SYSTEM_DEPS_LIBVVDEC_LIB: vvdec c++_static c++abi atomic m dl
        run: |
          # bindgen 生成 vvdec 绑定时要 NDK sysroot 的 C 头（stdio.h 等）；CMake 的 Android 支持认 ANDROID_NDK_ROOT。
          NDK="${NDK_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}}"
          export ANDROID_NDK_ROOT="$NDK"
          export CMAKE_TOOLCHAIN_FILE_aarch64_linux_android="$GITHUB_WORKSPACE/scripts/android-ndk.toolchain.cmake"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          pnpm tauri android build --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hongguo-android-apk
          path: crates/hongguo-tauri-app/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
