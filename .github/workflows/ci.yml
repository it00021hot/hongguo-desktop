name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt -- --check
      - run: cargo build-tool enhancement-assets
      - run: cargo build-tool release-preflight

  check:
    needs: format
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-15-intel
            triple: x86_64-pc-windows-msvc
          - os: macos-15
            triple: aarch64-apple-darwin
          - os: macos-15-intel
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.triple }}
          components: clippy
      - uses: swatinem/rust-cache@v2.9.3
        with:
          key: check-${{ matrix.triple }}
      - name: Prepare Windows cross compiler
        if: matrix.triple == 'x86_64-pc-windows-msvc'
        uses: ./.github/actions/windows-cross
      - name: Prepare authenticated media SDK
        shell: bash
        run: |
          cargo build-tool setup '${{ matrix.triple }}'
          if [ '${{ matrix.triple }}' != x86_64-pc-windows-msvc ]; then
            echo "DYLD_LIBRARY_PATH=$PWD/target/native-media/${{ matrix.triple }}/libde265-1.1.3/lib" >> "$GITHUB_ENV"
          fi
      - name: Build and lint the target workspace
        shell: bash
        run: |
          cargo_args=()
          if [ '${{ matrix.triple }}' = x86_64-pc-windows-msvc ]; then
            cargo_args+=(xwin)
          fi
          cargo "${cargo_args[@]}" build --locked --workspace --target '${{ matrix.triple }}'
          cargo "${cargo_args[@]}" clippy --locked --workspace --target '${{ matrix.triple }}' --all-targets -- -D warnings -D clippy::allow_attributes
      - name: File size gate
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            scripts/check-file-size.sh "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            scripts/check-file-size.sh "$BEFORE"
          fi

  desktop-package:
    needs: [format, check]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/nsh-desktop.yml
    with:
      source_ref: ${{ inputs.source_ref || github.ref }}
