name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Build and upload all three desktop packages
        type: boolean
        default: false
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      package:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.package && 'package' || 'check' }}
  cancel-in-progress: true

jobs:
  format:
    if: inputs.package || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - uses: swatinem/rust-cache@v2.9.3
        with:
          shared-key: build-tools
      - run: cargo fmt -- --check
      - run: cargo build-tool enhancement-assets
      - run: cargo build-tool theme-check
      - run: cargo build-tool release-preflight
      - name: File size gate
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            scripts/check-file-size.sh "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            scripts/check-file-size.sh "$BEFORE"
          fi

  desktop:
    needs: format
    uses: ./.github/workflows/nsh-desktop.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      package: ${{ inputs.package || false }}
