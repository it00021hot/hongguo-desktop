# 提交前置检查：Rust 三目标零警告（Windows 宿主 + macOS aarch64/x86_64 交叉）、
# 忽略标签禁令（-D clippy::allow_attributes，#[allow] 直接拒；确需断言用
# #[expect(reason)]，lint 不再触发时编译失败）、测试与前端 lint。
# Rust 侧在仓库根执行（workspace 根 manifest），--workspace 覆盖全部成员 crate。
# 启用：git config core.hooksPath .githooks
#
# dev 分支推送也跑 CI（2026-10-13 教训：gpui 壳 21 个编译不过的提交全推在
# dev 上，CI 只盯 main 等于没有；本地 hook 在未启用的克隆里也是哑的）。
# macOS 腿在原生 runner 上有完整 SDK，--workspace 含 hongguo-gpui 照常编译
# （本地交叉才需要排除它）；mf 等 Windows-only cfg 由 Windows 腿覆盖。
# 新增文件超 800 行由 scripts/check-file-size.sh 拒绝（单一职责的机械闸）。
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            clippy_args: --all-targets
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            clippy_args: --all-targets --target aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            clippy_args: --all-targets --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.rust_target }}
          # 钉死版本装的是 minimal profile（rustc+cargo+std）——@stable 时代
          # 靠 runner 预装组件混过去，钉版本后 clippy 必须显式声明
          components: clippy

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: .
          key: ${{ matrix.rust_target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Type check and build frontend
        run: pnpm build

      - name: ESLint
        run: pnpm exec eslint . --max-warnings=0

      - name: Set up verified native SDKs (macOS host and check target)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          node scripts/nsh.mjs setup "$host"
          if [ "$host" != "${{ matrix.rust_target }}" ]; then
            node scripts/nsh.mjs setup "${{ matrix.rust_target }}"
          fi
          echo "DYLD_LIBRARY_PATH=$PWD/target/native-media/$host/libde265-1.1.3/lib" >> "$GITHUB_ENV"

      - name: Set up verified native SDKs (Windows host and check target)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostTarget = ($compiler | Select-String '^host: (.+)$').Matches.Groups[1].Value.Trim()
          if (!$hostTarget) { throw 'Rust host target was not found' }
          node scripts/nsh.mjs setup $hostTarget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($hostTarget -ne '${{ matrix.rust_target }}') {
            node scripts/nsh.mjs setup '${{ matrix.rust_target }}'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Join-Path $env:GITHUB_WORKSPACE "target\native-media\$hostTarget\libde265-1.1.3\bin" >> $env:GITHUB_PATH

      - name: Preserve verified native SDKs and corresponding source
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-sdk-${{ matrix.rust_target }}
          path: |
            target/native-media/*/sdk.json
            target/native-media/*/libde265-*/
            target/native-media/*/vvdec-*/
          if-no-files-found: ignore

      - name: Rust tests
        # 离线 QA 与故障注入测试会修改进程级状态。
        run: cargo test --workspace --lib -- --test-threads=1

      - name: Rust clippy（零警告 + 忽略标签禁令）
        run: cargo clippy --workspace ${{ matrix.clippy_args }} -- -D warnings -D clippy::allow_attributes

      - name: File size gate（新增文件行数上限）
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            scripts/check-file-size.sh "origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            scripts/check-file-size.sh "${{ github.event.before }}"
          else
            echo "无可用 base（首推/新分支），跳过文件规模闸门"
          fi
