name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      desktop_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt -- --check
      - run: cargo build-tool enhancement-assets
      - run: cargo build-tool release-preflight

  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-15
            triple: aarch64-apple-darwin
          - os: macos-15-intel
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.triple }}
          components: clippy
      - uses: swatinem/rust-cache@v2.9.3
        with:
          key: check-${{ matrix.triple }}
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - name: Prepare authenticated media SDK
        shell: pwsh
        run: |
          cargo build-tool setup '${{ matrix.triple }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            "$PWD/target/native-media/${{ matrix.triple }}/libde265-1.1.3/bin" >> $env:GITHUB_PATH
          } else {
            "DYLD_LIBRARY_PATH=$PWD/target/native-media/${{ matrix.triple }}/libde265-1.1.3/lib" >> $env:GITHUB_ENV
          }
      - run: cargo build --locked --workspace --target ${{ matrix.triple }}
      - run: cargo clippy --locked --workspace --target ${{ matrix.triple }} --all-targets -- -D warnings -D clippy::allow_attributes
      - name: File size gate
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            scripts/check-file-size.sh "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            scripts/check-file-size.sh "$BEFORE"
          fi

  desktop-package:
    needs: [format, check]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/nsh-desktop.yml
    with:
      source_ref: ${{ inputs.source_ref || github.ref }}

  mobile-package:
    needs: [format, check]
    if: github.event_name != 'pull_request' && !inputs.desktop_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: ios-simulator
            triple: aarch64-apple-ios-sim
            args: ''
          - os: ubuntu-latest
            target: android
            triple: aarch64-linux-android
            args: '--abi arm64-v8a'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.triple }}
      - uses: swatinem/rust-cache@v2.9.3
        with:
          key: nsh-package-${{ matrix.triple }}
      - name: Build the pinned NSH CLI with native-host support
        shell: pwsh
        run: |
          cargo build --manifest-path vendor/nsh/Cargo.toml -p nsh-cli --target-dir target/nsh-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$PWD/target/nsh-cli/debug" >> $env:GITHUB_PATH
      - name: Prepare Android SDK and embedding runtime
        if: matrix.target == 'android'
        shell: bash
        env:
          ANDROID_TOOLS_ARCHIVE: commandlinetools-linux-15859902_latest.zip
          ANDROID_TOOLS_SHA256: 4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          curl -fL --retry 3 "https://dl.google.com/android/repository/$ANDROID_TOOLS_ARCHIVE" -o "$RUNNER_TEMP/$ANDROID_TOOLS_ARCHIVE"
          echo "$ANDROID_TOOLS_SHA256  $RUNNER_TEMP/$ANDROID_TOOLS_ARCHIVE" | sha256sum -c -
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$RUNNER_TEMP/$ANDROID_TOOLS_ARCHIVE" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          printf 'y\n%.0s' {1..20} | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0' 'ndk;30.0.16248370'
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "NSH_DISTRIBUTION=$RUNNER_TEMP/nsh-sdk" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/nsh-sdk/embed/android"
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -O https://github.com/longbridge/nsh/releases/download/v0.5.1/nsh-embed-android.zip
          curl -fL --retry 3 -O https://github.com/longbridge/nsh/releases/download/v0.5.1/nsh-embed-android.zip.sha256
          sha256sum -c nsh-embed-android.zip.sha256
          unzip -q nsh-embed-android.zip -d nsh-embed
          cp nsh-embed/nsh-embed-android/nsh.aar nsh-sdk/embed/android/nsh.aar
      - name: Package and sign through NSH
        shell: pwsh
        env:
          NSH_KEYSTORE_PASSWORD: ${{ secrets.NSH_KEYSTORE_PASSWORD }}
          NSH_ANDROID_KEYSTORE_BASE64: ${{ secrets.NSH_ANDROID_KEYSTORE_BASE64 }}
          NSH_ANDROID_KEY_ALIAS: ${{ secrets.NSH_ANDROID_KEY_ALIAS }}
        run: |
          $packageArgs = @('package', 'crates/hongguo-nsh', '--target', '${{ matrix.target }}', '--out', 'target/packages/${{ matrix.triple }}')
          if ('${{ matrix.args }}') { $packageArgs += '${{ matrix.args }}'.Split(' ') }
          if ('${{ matrix.target }}' -eq 'android' -and $env:NSH_ANDROID_KEYSTORE_BASE64) {
            $keystore = Join-Path $env:RUNNER_TEMP 'guava-release.jks'
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:NSH_ANDROID_KEYSTORE_BASE64))
            $packageArgs += @('--keystore', $keystore, '--key-alias', $env:NSH_ANDROID_KEY_ALIAS)
          }
          nsh @packageArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: guava-${{ matrix.triple }}
          path: target/packages/${{ matrix.triple }}/
          if-no-files-found: error
