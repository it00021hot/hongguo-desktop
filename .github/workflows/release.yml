name: NSH Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.7.0
        type: string
        required: true
      publish:
        description: Publish after all artifact checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: swatinem/rust-cache@v2.9.3
        with:
          shared-key: build-tools
      - id: metadata
        name: Validate tag, workspace versions and changelog
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: cargo build-tool release-preflight --tag "$RELEASE_TAG"

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.validate.outputs.sha }}
      package: true

  release:
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: swatinem/rust-cache@v2.9.3
        with:
          shared-key: build-tools
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: guava-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete release artifacts and prepare notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: cargo build-tool release-preflight --tag "$RELEASE_TAG" --artifacts artifacts --notes "$RUNNER_TEMP/release-notes.md"
      - name: Preserve the frozen legacy updater feed
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_UPDATE_TAG: v0.6.6
          LEGACY_UPDATE_SHA256: d36bac7c56fc7b5c25e72c14aa7faa8ee661cd8a88cf039f1f1cc64815a44fe9
        run: |
          gh release download "$LEGACY_UPDATE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/legacy-updater"
          echo "$LEGACY_UPDATE_SHA256  $RUNNER_TEMP/legacy-updater/latest.json" | sha256sum -c -
          cp "$RUNNER_TEMP/legacy-updater/latest.json" artifacts/latest.json
      - name: Stage the verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG; refusing to replace assets" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" artifacts/* --repo "$GH_REPO" --verify-tag --draft --title "番果 $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Publish the verified release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
