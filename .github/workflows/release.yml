name: NSH Desktop Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.7.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - id: metadata
        name: Validate tag, workspace versions and changelog
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: cargo build-tool release-preflight --tag "$RELEASE_TAG"

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.validate.outputs.sha }}
      desktop_only: true

  draft:
    needs: [validate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: guava-desktop-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete release artifacts and prepare notes
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: cargo build-tool release-preflight --tag "$RELEASE_TAG" --artifacts artifacts --notes "$RUNNER_TEMP/release-notes.md"
      - name: Create draft release without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG; refusing to replace assets" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" artifacts/* --repo "$GH_REPO" --verify-tag --draft --title "番果 $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
