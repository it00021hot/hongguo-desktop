name: NSH Desktop Checks and Packages

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
      package:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: windows-2025
            target: windows
            triple: x86_64-pc-windows-msvc
            args: ''
          - os: macos-15
            target: macos
            triple: aarch64-apple-darwin
            args: '--arch arm64'
          - os: macos-15-intel
            target: macos
            triple: x86_64-apple-darwin
            args: '--arch x86_64'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.triple }}
          components: clippy
      - uses: swatinem/rust-cache@v2.9.3
        with:
          shared-key: desktop-${{ matrix.triple }}
          workspaces: |
            . -> target
            vendor/nsh -> ../../target/nsh-cli
      - name: Activate x64 MSVC and Windows SDK
        if: matrix.target == 'windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALLATION=%%I"
          if not defined VS_INSTALLATION exit /b 1
          call "%VS_INSTALLATION%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl.exe || exit /b 1
          where rc.exe || exit /b 1
          for %%I in ("%VCToolsInstallDir%\bin\Hostx64\x64" "%WindowsSdkVerBinPath%\x64") do >>"%GITHUB_PATH%" echo %%~fI
          >>"%GITHUB_ENV%" echo INCLUDE=%INCLUDE%
          >>"%GITHUB_ENV%" echo LIB=%LIB%
          >>"%GITHUB_ENV%" echo LIBPATH=%LIBPATH%
      - name: Install pinned Inno Setup and Chinese translation
        if: matrix.target == 'windows' && inputs.package
        shell: pwsh
        env:
          INNO_SHA256: a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c
          TRANSLATION_SHA256: e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'inno-setup'
          New-Item -ItemType Directory -Path $tools | Out-Null
          $installer = Join-Path $tools 'installer.exe'
          Invoke-WebRequest -MaximumRetryCount 3 -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash -ne $env:INNO_SHA256) {
            throw 'Inno Setup installer SHA-256 mismatch'
          }
          $inno = Join-Path $tools 'compiler'
          $setup = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$inno`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0 -or !(Test-Path -LiteralPath (Join-Path $inno 'ISCC.exe') -PathType Leaf)) {
            throw "Inno Setup installation failed (exit $($setup.ExitCode))"
          }
          $translation = Join-Path $inno 'Languages/ChineseSimplified.isl'
          Invoke-WebRequest -MaximumRetryCount 3 -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/6ef32198ef1f7b7b375cd4b6b90896c2a58eb4c2/Files/Languages/ChineseSimplified.isl' -OutFile $translation
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $translation).Hash -ne $env:TRANSLATION_SHA256) {
            throw 'Inno Setup Chinese translation SHA-256 mismatch'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $inno -Encoding utf8
      - name: Prepare authenticated native SDK
        run: cargo build-tool setup '${{ matrix.triple }}'
      - name: Add macOS media library search path
        if: matrix.target == 'macos'
        shell: bash
        run: echo "DYLD_LIBRARY_PATH=$PWD/target/native-media/${{ matrix.triple }}/libde265-1.1.3/lib" >> "$GITHUB_ENV"
      - name: Build the target workspace
        run: cargo build --locked --workspace --target '${{ matrix.triple }}'
      - name: Lint the target workspace
        run: cargo clippy --locked --workspace --target '${{ matrix.triple }}' --all-targets -- -D warnings -D clippy::allow_attributes
      - name: Build the repository NSH CLI
        if: inputs.package
        run: cargo build --locked --manifest-path vendor/nsh/Cargo.toml -p nsh-cli --target-dir target/nsh-cli
      - name: Package through NSH
        if: inputs.package
        run: ./target/nsh-cli/debug/nsh${{ matrix.target == 'windows' && '.exe' || '' }} package crates/hongguo-nsh --target '${{ matrix.target }}' --out 'target/packages/${{ matrix.triple }}' ${{ matrix.args }}
      - name: Audit and archive release artifacts
        if: inputs.package
        run: cargo build-tool release-assets '${{ matrix.triple }}' 'target/packages/${{ matrix.triple }}' 'target/release-assets/${{ matrix.triple }}'
      - uses: actions/upload-artifact@v7.0.2
        if: inputs.package
        with:
          name: guava-desktop-${{ matrix.triple }}
          path: target/release-assets/${{ matrix.triple }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
