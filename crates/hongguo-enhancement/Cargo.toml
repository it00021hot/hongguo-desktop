[package]
name = "hongguo-enhancement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
hongguo-nsh-video-api = { path = "../hongguo-nsh-video-api" }
wgpu = { version = "=29.0.4", default-features = false, features = ["std", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { version = "=29.0.4", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=29.0.4", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { version = "=29.0.4", default-features = false, features = ["gles"] }

[dev-dependencies]
pollster = "0.4"
