[package]
name = "hongguo-desktop"
description = "红果短剧桌面客户端（Tauri 桌面版）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 本 crate 是 workspace 成员（根 Cargo.toml 的 members），[patch.crates-io] /
# [profile.*] 都在根 manifest，不在此处。
#
# 「纯配置 + 入口」：全部装配在 crates/hongguo-tauri，本 crate 只承载
# tauri.conf.json / capabilities / icons / gen 与 `generate_context!`
# （tauri-build 按 CARGO_MANIFEST_DIR 找这些资源，必须与上下文宏同 crate）。

[lib]
name = "hongguo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 装配体：插件 / 状态 / 协议 / command 全在这里。
hongguo-tauri = { path = "../hongguo-tauri" }
# `generate_context!` 宏的宿主（上下文与本 crate 的 tauri.conf.json 绑定）。
# protocol-asset：tauri.conf.json 声明了 assetProtocol scope，tauri-build 校验
# 该 feature 必须在本 crate 的 tauri 依赖上声明（与 hongguo-tauri 同款）。
tauri = { version = "2", features = ["protocol-asset"] }
# generate_context! 展开的代码引用 serde_json（宏体不经过 hongguo-tauri）。
serde_json = "1"

# ↓ 以下插件**代码不经手**（注册在 hongguo-tauri），声明为直接依赖只为让
# tauri-build 能解析 capabilities/*.json 里的插件权限（updater:default 等）——
# 权限清单只从本 crate 的直接依赖收集，藏在传递依赖里会报
# 「Permission xxx not found」。与 hongguo-tauri 的版本约束保持一致。
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-webdriver = "0.2"
