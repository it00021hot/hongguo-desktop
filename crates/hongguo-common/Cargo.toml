[package]
name = "hongguo-common"
description = "红果桌面版共用层：领域模型 / 统一错误 / 纯工具 / 跨端常量"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 领域模型自带默认构造：task 的任务 ID（uuid）、更新时间戳（chrono）、
# settings 的默认下载目录（dirs）——是 model 层的真实依赖，不是工具泄漏。
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "7"
# 与 reqwest 同一套 WHATWG URL 解析。离线门控不再手写 authority。
url = "2.5"

# Android 的 TLS 证书来源（utils/tls.rs）：reqwest("rustls") 默认的
# rustls-platform-verifier 在 Android 需要 JNI 初始化才可用，缺失时全部
# TLS 握手失败——改喂编译内置 webpki 根证书走纯 Rust 验证。桌面不编译。
# rustls 版本与 reqwest 依赖图内的 rustls 同线，保证 use_preconfigured_tls
# 的类型能被 reqwest 识别。
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "aws-lc-rs",
    "logging",
    "tls12",
] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
