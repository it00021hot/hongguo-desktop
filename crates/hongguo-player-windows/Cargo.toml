[package]
name = "hongguo-player-windows"
description = "红果桌面版 Windows 内置视频解码与 MediaEngine 音轨播放"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 本 crate 只在 Windows 目标上编译出内容（其余目标为空壳）；平台专属依赖全部
# 进本表，macOS 宿主上连依赖都不构建。
[dependencies]
hongguo-player-api = { path = "../hongguo-player-api" }
# 供数：一集的明文按 Range 从渐进流里取。
hongguo-stream = { path = "../hongguo-stream" }
log = "0.4"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
# 内置视频解码：建索引、解码、I420→BGRA；错误类型随它走。
hongguo-common = { path = "../hongguo-common" }
hongguo-softdec = { path = "../hongguo-softdec" }
# 宿主窗口句柄（契约层传进来的 RawWindowHandle）。
raw-window-handle = "0.6"
# MediaEngine 音轨/IMFByteStream 与 D3D11 软解帧纹理。
# 0.62 已在依赖图里（tauri/wry/sysinfo 传递引入），按需裁剪 feature。
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
# `#[implement]`（IMFByteStream / IMFMediaEngineNotify）生成的代码引用
# `windows_core::`，必须直接依赖且与 windows 同版本。
windows-core = "0.62"
# 视频 quad（vendored 补丁，见根 Cargo.toml 的 [patch.crates-io]）：
# 软解帧纹理与 GPUI 内容画进同一张渲染目标。
gpui-pre-windows = { version = "=0.3.12", package = "gpui-pre-windows", default-features = false }
