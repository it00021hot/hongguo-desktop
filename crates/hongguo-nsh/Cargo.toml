[package]
name = "hongguo-nsh"
description = "红果桌面版 NSH 壳：直接消费 hongguo-service，操作与 Tauri 客户端一致"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 与 GPUI 壳同一条纪律（见 crates/hongguo-gpui/Cargo.toml）：本壳**不复制业务**
# ——设备引导、全局状态、接口调用都走 service 同一段服务面；壳内只做窗口、
# 装配与渲染。cargo test 会把无测试框架的 bin 当用例直接执行（一跑就开窗口，
# 把全仓测试挂死），应用 bin 一律关掉 test 集成。
[[bin]]
name = "hongguo-nsh"
test = false

[dependencies]
# NSH 运行时：纯 Rust 路线，default-features = false 关掉 QuickJS 引擎。
# 版本钉死 0.1.1——发布版与 GitHub main 的 API 有漂移（Listener 收 &Event、
# VideoInfo 平铺字段、native_value 构造），壳层触点集中在 components/player，
# 升级一次改一层。
nsh-core = "0.1.1"
# 与 Tauri / GPUI 壳同一业务面。
hongguo-service = { path = "../hongguo-service" }
hongguo-store = { path = "../hongguo-store" }
hongguo-common = { path = "../hongguo-common" }
hongguo-api = { path = "../hongguo-api" }
hongguo-stream = { path = "../hongguo-stream" }
# 供数桥：在线流 + 封面转码的现算逻辑（与 Tauri 壳的协议注册同一份）。
hongguo-protocol = { path = "../hongguo-protocol" }
# 本地供数桥的 HTTP 承载（nsh 的 video/image 只认 URL）。
tiny_http = "0.12"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
# 业务事件总线是 tokio broadcast：泵任务在 nsh 的引擎线程上 await recv。
tokio = { version = "1", features = ["sync", "time"] }
# 文案资源解析（复用 Tauri 壳的 src/locales/*.json）。
serde_json = "1"

# NSH 平台后端按目标各取一份（default-features = false：不要 QuickJS）。
# 与 hongguo-nsh-demo 的依赖口径一致。
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.1.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.1.1", default-features = false }
