[package]
name = "hongguo-media-platform-macos"
description = "红果桌面版 macOS 平台原生化：VideoToolbox 硬编/硬解（契约见 hongguo-media-platform-api）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# 统一契约：PlatformRequest / bitrate_for。
hongguo-media-platform-api = { path = "../hongguo-media-platform-api" }
# 共用底座：统一错误（AppError / AppResult）。
hongguo-common = { path = "../hongguo-common" }
hongguo-media-videotoolbox = { path = "../hongguo-media-videotoolbox" }

# 本 crate 只在 macOS 目标上编译出内容（其余目标为空壳）。平台专属依赖
# 为零：VideoToolbox 是纯 C API，手写声明零依赖（vt/ffi.rs），经
# `#[link(kind = "framework")]` 直接链接系统框架，不需要任何绑定 crate。

[features]
# 门面 test-support 转发：跨 crate 的 e2e 测试通道门控（对齐 hongguo-video
# 的 fixtures / hongguo-store 的 ScopedDataDir 先例）。生产构建不带。
test-support = []
