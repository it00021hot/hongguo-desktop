[package]
name = "hongguo-media"
description = "红果桌面版媒体公共底座：demux / hevc / remux / HEVC 封装 / 后端标识"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# 共用底座：统一错误 + 领域模型。
hongguo-common = { path = "../hongguo-common" }
# MP4 容器解析（样本表 / 时序 / box 游走）——本 crate 只做编解码，不碰解密。
hongguo-video = { path = "../hongguo-video" }
serde = { version = "1", features = ["derive"] }
log = "0.4"
# 合并前校验「输出卷还剩多少字节」，只开 disk
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
