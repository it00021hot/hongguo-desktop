[package]
name = "hongguo-media"
description = "红果桌面版媒体公共底座：demux / hevc / remux / H.264 封装 / 封面 HEIF / 后端标识"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# 共用底座：统一错误 + 领域模型。
hongguo-common = { path = "../hongguo-common" }
# MP4 容器解析（样本表 / 时序 / box 游走）——本 crate 只做编解码，不碰解密。
hongguo-video = { path = "../hongguo-video" }
serde = { version = "1", features = ["derive"] }
log = "0.4"
# HEVC 解码：HEIC 封面纯 Rust 软解（封面阶梯的最后一级，零外部依赖）
rusty_h265 = "0.6.0"
# 封面 HEIC 解码后的 JPEG 编码（纯 Rust、零 unsafe）
jpeg-encoder = "0.6"
# 合并前校验「输出卷还剩多少字节」，只开 disk
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }

[dev-dependencies]
# 本 crate 的测试要造 MP4 样本与比对序列化产物，开启 hongguo-video 的测试辅助模块。
hongguo-video = { path = "../hongguo-video", features = ["test-support"] }
serde_json = "1"
