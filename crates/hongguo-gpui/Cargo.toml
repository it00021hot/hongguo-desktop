[package]
name = "hongguo-gpui"
description = "红果桌面版 GPUI 壳：直接消费 hongguo-service，操作与 Tauri 客户端一致"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 操作一致约定（docs/architecture-refactor.md §7）：本壳**不复制业务**——
# 设备引导（hongguo_service::device）、全局状态（AppStateInner）、接口调用
# （state.api_env() + hongguo_api）与 Tauri 壳走同一段服务面；壳内只做窗口、
# 装配与渲染。§5.3 spike（解码帧 → GPUI surface 上屏）直接消费取流编排与
# 解码出口，为 hongguo-playback 引擎定型。

# cargo test 会把无测试框架的 bin 当用例**直接执行**（本壳一跑就开窗口，
# 把全仓测试挂死——实测发生过）。应用 bin 一律关掉 test 集成。
# 需要测的东西放 tests/（集成测试，不碰 bin）：目前只有一条源码守卫——
# 「造 RenderImage 只有 image_upload.rs 一处，且必须过 RGBA→BGRA」。
[[bin]]
name = "hongguo-gpui"
test = false

# 表情插入行为断言：gpui test-support 只在 screenshot feature 里开
#（见上方 features 注释），缺 feature 时整个 test target 跳过。
[[test]]
name = "emoji_insert"
required-features = ["screenshot"]

# 播放器输入框的「渲染期主题皮肤补丁」安全性：gpui 的 Input 把光标/占位符/
# 选区颜色锁在主题里，壳只能在 render 期间临时改 token；断言不撞借用 panic
# 且渲染后原样还原（同上，依赖 test-support）。
[[test]]
name = "skin_input"
required-features = ["screenshot"]

# 舞台 tab 点击行为断言（同上，依赖 gpui test-support 派进程内鼠标事件）。
[[test]]
name = "tab_click_repro"
required-features = ["screenshot"]

# 连播横条命中回归（控制条 40px 透明悬停热区与横条重叠，后画层级必须可点）。
[[test]]
name = "binge_click_repro"
required-features = ["screenshot"]

# 自绘顶栏命中回归（同上：拖拽 handler 与绝对居中覆盖层叠加下按钮可点）。
[[test]]
name = "toolbar_click"
required-features = ["screenshot"]

# 找剧页搜索联想的键盘派发断言（同上，进程内走真实按键派发路径）。
[[test]]
name = "browse_suggest_keys"
required-features = ["screenshot"]

# 预览场景矩阵的覆盖率断言（纯数据，不出图、不碰窗口）：scenes.rs 自洽、
# 经 #[path] 源文件级引入（bin 无 lib 目标，集成测试进不了 crate 内部）。
# 不依赖 test-support，默认构建即可跑。
[[test]]
name = "preview_scenes"

# 进程内抓帧取证（screenshot.rs）：`--features screenshot` 才编入，走 GPUI
# `render_to_image`（不需要系统屏幕录制授权，无头也能拿真图）。默认构建不带。
#
# 不启用 gpui-kit 的 test-support：它会连带拉起 gpui-fast 加速栈，而那套
# 依赖与 gpui-pre 在 unicode-properties 上版本打架（0.1.3 vs 0.1.4），
# 直接解不开。`render_to_image` 的实现在 gpui-pre / gpui-platform 两处
# 门控，同版本单独开这两家的 test-support 即可。
[features]
screenshot = [
    "dep:gpui-pre",
    "dep:gpui-pre-platform",
    "gpui-pre/test-support",
    "gpui-pre-platform/test-support",
]
# 帧耗时取证（排障构建）：给 gpui-pre 打开 profiler，stage 周期日志打
# draw/present 直方图均值与最大值——区分「建树慢」「layout/paint 慢」与
# 「present 等 vsync」。默认不开。
perf-probe = ["dep:gpui-pre", "gpui-pre/profiler"]

[dependencies]
# GPUI Kit（longbridge/gpui-kit）：gpui-base + gpui-component 聚合，桌面壳按
# .agents/skills/gpui-ui-design 的设计/编码规范构建（组件系统 + 主题令牌）。
gpui-kit = "0.7.3"
# 仅 `screenshot` feature 用：同版本的 gpui-pre / 平台层，为开 test-support
# （`render_to_image` 的实现就门控在这两处）。版本必须与 gpui-kit 钉的一致。
gpui-pre = { version = "=0.3.9", package = "gpui-pre", optional = true }
gpui-pre-platform = { version = "=0.3.9", package = "gpui-pre-platform", optional = true }
# 与 Tauri 壳同一业务面。
hongguo-service = { path = "../hongguo-service" }
hongguo-api = { path = "../hongguo-api" }
# 封面三级转码阶梯（HEIC → JPEG，含磁盘缓存）——与 Tauri 壳的 hongguo-cover:// 同源。
hongguo-protocol = { path = "../hongguo-protocol" }
hongguo-common = { path = "../hongguo-common" }
hongguo-store = { path = "../hongguo-store" }
# §5.3 spike：播放引擎（解码/音频/同步）+ 取流编排面。
hongguo-playback = { path = "../hongguo-playback" }
hongguo-stream = { path = "../hongguo-stream" }
# 回放契约 + 系统播放器门面（macOS AVPlayer / Windows MediaEngine 实现分居
# hongguo-player-* crate）：壳只认契约，不写平台分支，也不直接摸平台依赖。
hongguo-player = { path = "../hongguo-player" }
hongguo-media = { path = "../hongguo-media" }
# 帧契约（VideoFrame/FrameBuffer）：壳只认契约 crate——平台实现经门面
# 按编译目标选择，是 playback 引擎的事，与 UI 无关。
hongguo-media-platform-api = { path = "../hongguo-media-platform-api" }
# 设置页的转码能力探测（ffmpeg/硬件编码）：与 Tauri 的 decode_capability
# command 同一段（probe::detect / redetect）。
hongguo-media-platform = { path = "../hongguo-media-platform" }
# service 的 async 函数族依赖 tokio 运行时设施（sleep / Semaphore）；GPUI 的
# 执行器不是 tokio，本壳自带一个运行时线程做桥（oneshot 回传，见 main.rs）。
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
# 默认语言跟随系统：读 NSLocale（macOS）/系统区域，而非 LANG 环境变量——
# 终端里 LANG 常是 en_US.UTF-8，中文系统的开发机上「跟随系统」会直接变
# 英文。0.3.2 已在依赖树中（gpui 字体栈），无新增代码。
sys-locale = "0.3"
# 封面远程拉取：gpui 图片缓存的 HttpClient 桥（http_client.rs）与 BoxFuture。
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
bytes = "1"
futures = "0.3"
anyhow = "1"
# 封面 HEIC 走协议层转 JPEG 后的位图解码（对齐 gpui 内置的 image 版本）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1"
log = "0.4"
env_logger = "0.11"
# relative_time 超 30 天回落「M月D日」：本地时区日历换算（common 同款依赖）。
chrono = "0.4"
serde_json = "1"

# 小屏落位/置顶的 HWND 获取（gpui Window 实现的 HasWindowHandle；只
# Windows 小屏路径用）。
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

# 视频 surface 桥接（home.rs video_layer）：gpui 0.3.9 起收 objc2 的
# CFRetained<CVPixelBuffer>，解码侧给的是 core-video TCFType 包装——
# 借裸指针 CFRetain 一次再交 surface 所有权。版本与 gpui-pre 钉的一致，
# 类型必须同源（两套 objc2-core-video 是不同类型，桥不过去）。
[target.'cfg(target_os = "macos")'.dependencies]
# TCFType trait（CVPixelBuffer::as_ptr 用）；与 core-video 自身的
# core-foundation 同大版本，不引入第二份（hongguo-media-platform 同款）。
core-foundation = "0.10"
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    # CVBuffer 的 RefEncode（copyPixelBufferForItemTime 的返回值）挂在该 feature 下
    "objc2",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
] }
# 窗口原语（macos.rs）：小屏落位/置顶/竖屏几何/隐身藏显。objc2 与
# objc2-app-kit 的版本跟 gpui-pre-macos 一致，同在该依赖树里，不新增外部
# crate；只开用到的类，别拉整套 AppKit 绑定。
raw-window-handle = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSEvent",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSGeometry",
    # 播放期活动断言（play_activity.rs）：NSProcessInfo + 原因字符串
    "NSProcessInfo",
    "NSString",
    # Phase 0 AV spike：自定义 scheme URL / 内存字节回包 / 队列 item 数组
    "NSURL",
    "NSData",
    "NSArray",
] }
