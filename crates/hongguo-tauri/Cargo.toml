[package]
name = "hongguo-tauri"
description = "红果桌面版 Tauri 壳层装配：插件注册、状态注入、协议挂载、command 挂载"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# IPC / 窗口 / 协议注册的宿主框架。
tauri = { version = "2", features = ["protocol-asset"] }
# 评论附图 / 上传自定义表情的系统文件面板：WKWebView 对 `<input type=file>`
# 不弹选择面板（真实点击到达 input 也不调 runOpenPanel 委托，实测
# 2026-10-26，WebView2 无此问题），选图改走 Rust 原生对话框。
rfd = "0.15"
# 选图后的尺寸/格式解码（`emoticon_pick_image` 一次带齐，前端不再量图）。
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# 单实例锁：两个进程同时写 data.json 会让下载记录随机丢一条。
# 必须是第一个注册的插件（官方要求，锁要抢在窗口创建之前）。
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 更新：签名校验的安装包经 GitHub Releases 的 latest.json 分发；
# 进程插件只用到 relaunch（下载完成后重启进新版本）
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"
# dev 调试通路：在 app 里内嵌 W3C WebDriver 服务器（127.0.0.1:4445），macOS 的
# WKWebView 没有对外 CDP/远程调试协议（桌面目标被 Apple 私有 entitlement 锁给
# Safari），这是官方推荐的等效调试通路。依赖无条件编译——cargo 不支持用
# `debug_assertions` 选依赖（写了直接警告，行为因版本而异）；「只在 dev 暴露」
# 由 lib.rs 里 `#[cfg(debug_assertions)]` 的注册点保证，release 不注册即无端口，
# 未引用的代码随后被 lto+strip 剔除。驱动脚本见 scripts/webdriver.mjs，
# 说明见 docs/webview-cdp-testing.md。
tauri-plugin-webdriver = "0.2"
# 业务编排层（AppState / 九域 service）。
hongguo-service = { path = "../hongguo-service" }
# 自定义 URI 协议供数逻辑（本 crate 只做 Builder 注册胶水与 HTTP 组装）。
hongguo-protocol = { path = "../hongguo-protocol" }
# 流线格式（协议胶水把元组产物组装成响应时引用类型）。
hongguo-stream = { path = "../hongguo-stream" }
# 共用底座（AppError / scheme 常量）与持久化（开库与锁重试）。
hongguo-common = { path = "../hongguo-common" }
hongguo-store = { path = "../hongguo-store" }
# command 返回模型直接复用接口客户端的类型（IPC 载荷与 API 模型同构）。
hongguo-api = { path = "../hongguo-api" }
# 设备生命周期 bootstrap（adopt / 对齐 version_code）需要档案类型与注册原语。
hongguo-signer = { path = "../hongguo-signer" }
# 转码能力 command 直接回传平台层的能力模型。
hongguo-media-platform = { path = "../hongguo-media-platform" }
serde_json = "1"
# 异步 command 的运行时内设施（sleep 轮询）。
# sync：事件转发器匹配 broadcast::error::RecvError；time：既有用法。
tokio = { version = "1", features = ["sync", "time"] }
# 小窗模式的鼠标出界检测（app_cmd）。
mouse_position = "0.1"
# panic 取证的本地时间戳（diagnostics）。
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
tauri-plugin-global-shortcut = "2"

# macOS 原生红绿灯的藏/显（小屏模式，app_cmd）：直接对三颗 NSWindowButton
# setHidden，而不是 set_decorations 切 borderless——tao 的 set_decorations 是
# **整体替换 styleMask**，会把 Overlay 全出血依赖的 FullSizeContentView 位抹掉。
# objc2 / objc2-app-kit 已在 tao 的依赖树里，同版本声明为直接依赖不新增外部 crate。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
# e2e（testing/media_pipeline_e2e.rs）要构造 MP4 样本与重定向数据目录。
hongguo-video = { path = "../hongguo-video", features = ["test-support"] }
hongguo-store = { path = "../hongguo-store", features = ["test-support"] }
# e2e 是跨层用例：直接驱动媒体核心与平台层，不经 service 的编排。
hongguo-media = { path = "../hongguo-media" }
# 平台层的测试通道（transcode_h264_for_tests）由 test-support 门控，e2e 开启。
hongguo-media-platform = { path = "../hongguo-media-platform", features = ["test-support"] }
tokio = { version = "1", features = ["full", "test-util"] }
serde_json = "1"
