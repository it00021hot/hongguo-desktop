[package]
name = "hongguo-stream"
description = "红果桌面版在线流契约：内存渐进流、按 (vid, 档位) 分条的缓存、Range 应答与进程级流缓存"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# 共用底座：档位模型（VideoDefinition）。
hongguo-common = { path = "../hongguo-common" }
# 流数据面的下层原语：稀疏密文缓冲 + 惰性解密计划。
hongguo-video = { path = "../hongguo-video" }
# 条目锁与 LRU 时间戳；本 crate 全程同步，不引异步运行时。
parking_lot = "0.13"
log = "0.4"

[dev-dependencies]
# 渐进流的用例要构造真实 MP4 样本（streaming_tests::assemble），开启
# hongguo-video 的测试辅助模块；生产构建不带该 feature。
hongguo-video = { path = "../hongguo-video", features = ["test-support"] }
