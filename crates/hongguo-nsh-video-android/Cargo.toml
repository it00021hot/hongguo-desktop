[package]
name = "hongguo-nsh-video-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "android")'.dependencies]
hongguo-nsh-video-api = { path = "../hongguo-nsh-video-api" }
hongguo-enhancement = { path = "../hongguo-enhancement" }
wgpu = { version = "=29.0.4", default-features = false, features = ["gles", "wgsl"] }
jni = "0.21"
log = "0.4"
ndk = { version = "0.9", features = ["nativewindow"] }
raw-window-handle = "0.6"
serde_json = "1"
pollster = "0.4"
