[package]
name = "hongguo-nsh-video-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "android")'.dependencies]
hongguo-nsh-video-api = { path = "../hongguo-nsh-video-api" }
hongguo-media-types = { path = "../hongguo-media-types" }
hongguo-video-gpu = { path = "../hongguo-video-gpu" }
hongguo-video-color = { path = "../hongguo-video-color" }
hongguo-enhancement = { path = "../hongguo-enhancement" }
wgpu = { version = "=29.0.4", default-features = false, features = ["gles", "wgsl"] }
jni = "0.21"
log = "0.4"
ndk = { version = "0.9", features = ["nativewindow", "api-level-28"] }
raw-window-handle = "0.6"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
pollster = "0.4"
glow = "=0.17.0"

[dev-dependencies]
hongguo-media-types = { path = "../hongguo-media-types" }
hongguo-video-color = { path = "../hongguo-video-color" }
