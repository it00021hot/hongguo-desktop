[package]
name = "hongguo-media-platform-windows"
description = "红果桌面版 Windows 平台原生化：Media Foundation 硬编/硬解 + WIC 静图（契约见 hongguo-media-platform-api）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# 统一契约：帧载体 / 解码器 trait / PlatformRequest / bitrate_for。
hongguo-media-platform-api = { path = "../hongguo-media-platform-api" }
# 共用底座：统一错误（AppError / AppResult）。
hongguo-common = { path = "../hongguo-common" }
# 纯 Rust 编解码核心：解复用 / 参数集读取 / 音轨直通 / 封装（转码管线复用）。
hongguo-media = { path = "../hongguo-media" }
# 样本表类型（TrackInfo）：平台硬解要把 hvcC 参数集转 Annex-B 喂解码器。
hongguo-video = { path = "../hongguo-video" }
log = "0.4"
parking_lot = "0.12"
# 封面 WIC 级解码后的 JPEG 编码（与 hongguo-media 的 heif 软解级同一产物口径）。
jpeg-encoder = "0.6"

# 本 crate 只在 Windows 目标上编译出内容（其余目标为空壳）；平台专属依赖
# 全部进本表，macOS 宿主上连依赖都不构建。
#
# 选 windows crate 而不是手写虚表：MF 是 COM API（接口经虚表调用），手排
# 虚表槽位错一个就是运行期崩到错误函数上。0.62 已在依赖图里（tauri/wry/
# sysinfo 传递引入），声明为直接依赖不新增外部 crate，feature 按需裁剪
# 只编译用到的接口。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    # WIC 静图解码：封面的平台级通路（HEIF/HEVC 扩展在则走系统解码器）
    "Win32_Graphics_Imaging",
    # 内存流：HEIC 字节 → IStream → WIC 解码器
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
] }

[features]
# 门面 test-support 转发：跨 crate 的 e2e 测试通道门控（transcode_h264_for_tests
# 的 h264_mf 软编回落路径）。生产构建不带，函数不编译。
test-support = []
