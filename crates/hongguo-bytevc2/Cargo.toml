[package]
name = "hongguo-bytevc2"
description = "ByteVC2（bvc2）识别、参数集转换与解帧（默认 libvvdec，oxideav 可回退）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["vvdec", "oxideav"]
source-build = ["vvdec", "hongguo-vvdec-sys/source-build"]
# Fraunhofer VVdeC 3.2.1（Clear BSD），固定源码静态构建。
vvdec = ["dep:hongguo-vvdec-sys"]
# 纯 Rust H.266（oxideav）。保留为 HONGGUO_BYTEVC2_DECODER=oxideav / 无 vvdec 时的回退与测试夹具。
oxideav = ["dep:oxideav-h266", "dep:oxideav-core"]

[dependencies]
hongguo-common = { path = "../hongguo-common" }
hongguo-video = { path = "../hongguo-video" }
hongguo-media-types = { path = "../hongguo-media-types" }
# 自有安全适配读取完整颜色字段，native 版本与构建固定在 sys crate。
hongguo-vvdec-sys = { path = "../hongguo-vvdec-sys", optional = true }
# 纯 Rust H.266。librempeg 的 bvc2 解码器就是 VVC 核 + 固定 4 字节长度前缀，
# 运行时不链接、不调用 ffmpeg / librempeg。0.0.11 是当前 crates.io 最新版（MIT）。
oxideav-h266 = { version = "=0.0.11", optional = true }
oxideav-core = { version = "0.1.43", optional = true }

[dev-dependencies]
