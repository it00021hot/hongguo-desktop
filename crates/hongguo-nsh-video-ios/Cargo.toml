[package]
name = "hongguo-nsh-video-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true
hongguo-nsh-video-api = { path = "../hongguo-nsh-video-api" }
hongguo-nsh-video-apple = { path = "../hongguo-nsh-video-apple" }
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
dispatch2 = "0.3"
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CAMetalLayer"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["UIView", "UIResponder"] }
serde_json = "1"
log = "0.4"
