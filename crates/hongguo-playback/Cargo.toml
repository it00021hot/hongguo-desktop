[package]
name = "hongguo-playback"
description = "Shared indexed native video and PCM playback sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hongguo-common = { path = "../hongguo-common" }
hongguo-video = { path = "../hongguo-video" }
hongguo-media-types = { path = "../hongguo-media-types" }
hongguo-bytevc2 = { path = "../hongguo-bytevc2", default-features = false, features = ["vvdec"] }
hongguo-codec-ffi = { path = "../hongguo-codec-ffi" }
parking_lot = "0.13"
hongguo-audio-api = { path = "../hongguo-audio-api" }
hongguo-audio = { path = "../hongguo-audio" }
log = "0.4"

[dev-dependencies]
hongguo-video = { path = "../hongguo-video", features = ["test-support"] }
