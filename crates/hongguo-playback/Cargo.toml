[package]
name = "hongguo-playback"
description = "红果桌面版播放引擎：样本表驱动逐段取流 → 平台解码 → 音频时钟 A/V 同步"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# 引擎是壳无关的媒体末端（§5.3 落地）：输入 (vid, 档位)，出 NV12 帧 + 扬声器
# 声音。取流编排（prepare/prefetch）留在调用方（壳）——引擎只消费已经注册进
# hongguo-stream 缓存的流（serve 逐段读），与具体壳、具体取流入口解耦。

[dependencies]
# 基础：错误类型。
hongguo-common = { path = "../hongguo-common" }
# 样本表（demux）与参数集提取。
hongguo-media = { path = "../hongguo-media" }
hongguo-video = { path = "../hongguo-video" }
# 平台逐帧解码出口（macOS：VT 视频 + AudioToolbox AAC；Windows MF 是后续目标）。
hongguo-media-platform = { path = "../hongguo-media-platform" }
# 流数据面：serve() 进程内按 Range 取明文字节（ReaderDemand 驱动填充）。
hongguo-stream = { path = "../hongguo-stream" }
# 回放契约（事件 / 播放源 / 打开参数 / 舞台几何）：与系统播放器共用同一套。
hongguo-player-api = { path = "../hongguo-player-api" }
log = "0.4"
parking_lot = "0.12"
# 引擎的任务族跑在调用方的 tokio 运行时里（壳经桥 spawn）。
tokio = { version = "1", features = ["rt", "sync", "time"] }
# 音频输出经平台契约（hongguo-media-platform::platform::audio）：macOS 是
# AudioToolbox 输出单元，Windows 是 cpal。引擎不再直接依赖 cpal——cpal 的
# macOS 后端建流时会初始化带输入作用域的 AudioUnit，触发麦克风授权。
# 解码 PCM → 输出回调之间的无锁环形缓冲。
ringbuf = "0.4"

[dev-dependencies]
# 造 MP4 样本（test-support 门控的 fixtures）：本地成品源测试用。
hongguo-video = { path = "../hongguo-video", features = ["test-support"] }
