[package]
name = "hongguo-downloader"
version = "2.0.0"
description = "红果短剧全集批量下载器（Tauri 桌面版）"
authors = ["hongguo-downloader contributors"]
license = "GPL-3.0"
edition = "2021"
# 被 sysinfo 0.39.6 的 MSRV 抬上来的：该版本要求 1.95，本项目的代码本身用不到
# 2024 edition 的特性，保持 edition = 2021 不动。
rust-version = "1.95"

[lib]
name = "hongguo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "gzip",
] }
futures-util = "0.3"
bytes = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
urlencoding = "2"
md-5 = "0.10"
sha2 = "0.10"
sm3 = "0.3"
aes = "0.8"
ctr = "0.9"
cbc = { version = "0.1", features = ["alloc"] }
digest = "0.10"
regex = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
percent-encoding = "2"
chrono = "0.4"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
rusty_h265 = "0.6.0"
rusty_h264 = "0.16.0"
muxide = "0.2.5"
# 合并前校验要问「输出卷还剩多少字节」。只开 disk：默认 feature 会把
# component / network / system / user 一并拖进来，本项目一个都用不上。
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }

# 这里刻意不列 videotoolbox / windows( Media Foundation ) / rusty_aac：
# 平台硬编一律走 `media::ffmpeg` 的外部 ffmpeg 探测，音轨不解码（AAC 直通），
# 三者都是零引用。写平台 FFI 的收益不抵「无法在 CI 里验证」的代价。

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 只对这一个依赖关掉 debug 断言，别把自己的代码也一起降级。
#
# `rusty_h265-accel` 的去块滤波在帧边界有个过严的 `debug_assert`
# （deblock.rs:331，水平边要求 x >= 4）。1080p 真实码流第一帧就踩到，
# 结果 dev 下整个软解必然 panic，转码兜底这条路等于不存在。
#
# 它确实只是一条断言：release 不编译它，该段 SIMD 路径又由 `if ok` 守住
# 会整段跳过，实测 release 下 1080p 解码正常、帧数与样本数一致。
# 不这么配就只能全局降级或强制 release，那会把真实断言一起埋掉。
[profile.dev.package.rusty_h265-accel]
debug-assertions = false
