[package]
name = "hongguo-desktop"
version = "0.1.0"
description = "红果短剧桌面客户端（Tauri 桌面版）"
authors = ["hongguo-desktop contributors"]
license = "GPL-3.0"
edition = "2024"
# MSRV 声明跟随当前 stable 工具链（1.99）。这是个应用不是库，MSRV 只影响
# cargo 依赖解析的版本上限，实际开发与 CI 都跑最新 stable。
rust-version = "1.99"

[lib]
name = "hongguo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 单实例锁：两个进程同时写 data.json 会让下载记录随机丢一条。
# 必须是第一个注册的插件（官方要求，锁要抢在窗口创建之前）。
tauri-plugin-single-instance = "2"
# dev 调试通路：在 app 里内嵌 W3C WebDriver 服务器（127.0.0.1:4445），macOS 的
# WKWebView 没有对外 CDP/远程调试协议（桌面目标被 Apple 私有 entitlement 锁给
# Safari），这是官方推荐的等效调试通路。依赖无条件编译——cargo 不支持用
# `debug_assertions` 选依赖（写了直接警告，行为因版本而异）；「只在 dev 暴露」
# 由 lib.rs 里 `#[cfg(debug_assertions)]` 的注册点保证，release 不注册即无端口，
# 未引用的代码随后被 lto+strip 剔除。驱动脚本见 scripts/webdriver.mjs，
# 说明见 docs/webview-cdp-testing.md。
tauri-plugin-webdriver = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "stream",
    "gzip",
] }
futures-util = "0.3"
# zlib-rs 后端：设备注册的 TT-Encrypt V5 要求 gzip 字节流与服务端 zlib
# 逐字节一致，miniz_oxide 的流不同会被静默拒绝
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
bytes = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
rand = "0.10"
base64 = "0.23"
hex = "0.4"
urlencoding = "2"
md-5 = "0.11"
sha2 = "0.11"
sm3 = "0.5"
aes = "0.9"
ctr = "0.10"
cbc = { version = "0.2", features = ["alloc"] }
digest = "0.11"
time = { version = "0.3", features = ["formatting", "macros"] }
percent-encoding = "2"
chrono = "0.4"
dirs = "7"
uuid = { version = "1", features = ["v4"] }
rusty_h265 = "0.6.0"
rusty_h264 = "0.16.0"
muxide = "0.2.5"
# 合并前校验要问「输出卷还剩多少字节」。只开 disk：默认 feature 会把
# component / network / system / user 一并拖进来，本项目一个都用不上。
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
turso = { version = "0.8.1", default-features = false }
mouse_position = "0.1"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"

# 平台硬编走 `media::platform`（macOS VideoToolbox / Windows Media Foundation）。
# FFI 路线按 API 性质分：VideoToolbox 是纯 C API，手写声明零依赖（vt/ffi.rs）；
# Media Foundation 是 COM（虚表调用），手排虚表槽位错一个就是运行期崩——
# 用 windows crate 的生成绑定（见下方 target 专属依赖，不新增外部 crate）。
# ffmpeg 外部进程是平台硬编不可用时的中间回退，音轨一律不解码（AAC 直通）。
# 验证策略：Apple Silicon 的 macOS CI 真跑 VideoToolbox 端到端；Windows 侧
# 本机真机验收（GTX 1650：NVENC MFT + HEVC 扩展解码全链路 e2e 绿），CI 验
# 纯逻辑层；软解路径（rusty_h265/rusty_h264）永远兜底，产物一律过可播校验闸。

# Windows 平台硬编（Media Foundation）的 COM 绑定。选 windows crate 而不是
# 手写虚表：MF 是 COM API（接口经虚表调用），与 macOS VideoToolbox 的纯 C
# API 不同——手排虚表槽位错一个就是运行期崩到错误函数上。0.62 已在依赖图里
# （tauri/wry/sysinfo 传递引入），声明为直接依赖不新增外部 crate，feature
# 按需裁剪只编译用到的接口。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

# macOS 原生红绿灯的藏/显（小屏模式）：直接对三颗 NSWindowButton setHidden，
# 而不是 set_decorations 切 borderless——tao 的 set_decorations 是**整体替换
# styleMask**，会把 Overlay 全出血依赖的 FullSizeContentView 位抹掉（标题条
# 重新占位 28px、内容被顶下去，外框实测 840→868）。objc2 / objc2-app-kit 已
# 在 tao 的依赖树里，同版本声明为直接依赖不新增外部 crate——与上面复用
# windows crate 是同一思路。实现见 app_cmd 的 set_traffic_lights_hidden。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# CI 实测（Windows，2026-10）：fat LTO + 单 codegen 单元让 rustc 段 17-18 分钟，
# 是发版流水线的大头。换 thin LTO + 默认并行单元后编译时间砍半以上；本项目的
# 热点（编解码 SIMD、运行期指令集分发）都在独立 crate 里自带优化，自身代码是
# 胶水层，跨 crate 全量优化收益本来就小。体积略涨（<5%），换发版速度值得。
#
# ⚠️ 绝不能加 panic = "abort"（2026-10-09 小窗闪退实录）。abort 策略让两类
# catch 机制在 release 里静默失效，而 dev 默认 unwind——线上和开发行为分裂：
# 1. wry 的 WKURLSchemeHandler 回包用 objc2::exception::catch 兜 NSException；
#    abort 下 catch 的着陆垫被替换成 panic_cannot_unwind，ObjC 异常直接
#    abort——进小窗 resize 时 WebKit 取消 in-flight 流请求，worker 回包撞上
#    已停止的 task 即抛异常，v0.1.0 装机版小窗必闪退（crash.log: "panic in a
#    function that cannot unwind"，线程 hongguo-proto-stream-1）。
# 2. protocol/register.rs 的 catch_unwind 三层防线整体变 no-op——协议路径上
#    任何一个 panic 都从「一条请求回 500」升级成全进程 abort，2026-10-07
#    那次「回调 panic → abort → 僵尸进程锁库」的教训在 release 里等于没修。
# 代价是二进制略大（unwind 表）与微弱性能差，换正确性，值。
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# 只对这一个依赖关掉 debug 断言，别把自己的代码也一起降级。
#
# `rusty_h265-accel` 的去块滤波在帧边界有个过严的 `debug_assert`
# （deblock.rs:331，水平边要求 x >= 4）。1080p 真实码流第一帧就踩到，
# 结果 dev 下整个软解必然 panic，转码兜底这条路等于不存在。
#
# 它确实只是一条断言：release 不编译它，该段 SIMD 路径又由 `if ok` 守住
# 会整段跳过，实测 release 下 1080p 解码正常、帧数与样本数一致。
# 不这么配就只能全局降级或强制 release，那会把真实断言一起埋掉。
[profile.dev.package.rusty_h265-accel]
debug-assertions = false

# 根治「测试高并发间歇崩」：rusty_h264-common 默认给整个进程强装第三方分配器
# rusty_alloc 1.1.6（`rusty_alloc-api = "=1.1.6"` 锁死版本；rusty_h264 default 转发
# global-alloc，feature unification 关不掉）。1.1.6 有并发 bug——多线程分配下整个
# 进程间歇 abort（"memory allocation of 22906492240 bytes failed"），全量 cargo
# test 默认并发 6 次崩 2 次，生产跑转码/在线播放同样暴露。
#
# 两层处理：
# 1. vendor/rusty_h264_common —— patch rusty_h264-common 0.16.0，摘掉它的
#    #[global_allocator]（进程回到 Rust 标准分配器，根治；上游如果哪天改用
#    修好的 alloc 再整体撤掉）。
# 2. vendor/rusty_alloc* —— rusty_alloc 2.2.2（2026-10-01，修了 9 月一连串
#    并发问题）以 1.1.6 的版本号顶替。global-alloc feature 虽已不生效，
#    但保留：将来谁把分配器装回去时用的也是修过的版本。
[patch.crates-io]
# muxide 0.2.5 的 B 帧流封装有设计缺陷：interleave schedule 按 PTS 排序
# 写 mdat，而 stco 按写入序、stsz/stts/ctts 按输入序构建——B 帧流表与
# 数据互相矛盾，产物不可解（vendor 补丁把视频排序键改为 dts=解码序，
# 无 B 帧的流 dts==pts 行为不变）。上游 0.2.5 为最新版，待修复后回收。
muxide = { path = "vendor/muxide" }
rusty_alloc = { path = "vendor/rusty_alloc" }
rusty_alloc-api = { path = "vendor/rusty_alloc_api" }
rusty_h264-common = { path = "vendor/rusty_h264_common" }
# tauri-plugin-webdriver 0.2.3 在 Windows 上声明 webview2-com 0.38 / windows
# 0.61，而 tauri 2.12 已把 webview2-com 抬到 0.39（windows 0.62）——同一依赖图
# 里两套 windows-core 类型不互通，插件 platform/windows.rs 拿 tauri 侧的
# ICoreWebView2 配自家旧版 handler 直接编译失败（macOS 不受影响，webview2-com
# 只进 Windows 目标）。vendor 补丁把三件套抬到 0.39/0.62 并适配 API 改动。
# 上游 0.2.3 为最新版，待兼容版发布后回收。
tauri-plugin-webdriver = { path = "vendor/tauri_plugin_webdriver" }
