# 编译期提速开关。三个目标各按其**真实硬件下限**取值，
# 宁可少拿收益，也不让老机器跑不起来。
#
# 收益从哪来：编解码热内核（rusty_h265 封面软解、MP4 封装）自己跑
# `is_x86_feature_detected!` 做运行期分发，这个 flag 对它们一点用都没有；
# 吃到的是内核周围标量代码的自动向量化。
#
# 用 [target.<triple>] 而不是 [build]：后者对所有目标生效，写死
# x86-64-v3 会让 aarch64 直接编译失败，而 bundle.targets 里有 dmg。

# Windows x64 uses baseline instructions; codecs select SIMD at runtime.
# NSH 发布包保留 8MB 主线程栈，PE 审计同步校验该约束；静态 CRT 不要求客户安装运行库。
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-cpu=x86-64",
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/STACK:8388608",
]

# Apple Silicon：M1 及以后的机器全都支持 apple-m1 这一档，不用再细分
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "target-cpu=apple-m1",
    "-C", "link-arg=-Wl,-rpath,@executable_path/../Frameworks",
    "-C", "link-arg=-Wl,-rpath,@executable_path/../native-media/aarch64-apple-darwin/libde265-1.1.3/lib",
    "-C", "link-arg=-Wl,-rpath,@executable_path/../../native-media/aarch64-apple-darwin/libde265-1.1.3/lib",
]

# Intel Mac 使用 v2（SSE4.2/POPCNT），不设置全局 AVX2 下限。
[target.x86_64-apple-darwin]
rustflags = [
    "-C", "target-cpu=x86-64-v2",
    "-C", "link-arg=-Wl,-rpath,@executable_path/../Frameworks",
    "-C", "link-arg=-Wl,-rpath,@executable_path/../native-media/x86_64-apple-darwin/libde265-1.1.3/lib",
    "-C", "link-arg=-Wl,-rpath,@executable_path/../../native-media/x86_64-apple-darwin/libde265-1.1.3/lib",
]
